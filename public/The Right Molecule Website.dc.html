<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Right Molecule — PCOS Harmony</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* Phones get the mobile page; ?desktop keeps this one */try{var q=location.search;if((screen.width||9999)<=640&&q.indexOf('desktop')<0&&q.indexOf('embed')<0)location.replace('mobile.html'+q)}catch(e){}</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script>try{if(sessionStorage.getItem('trm-transit'))document.documentElement.setAttribute('data-trm-transit','')}catch(e){}</script>
<style>html[data-trm-transit] body::after{content:"";position:fixed;inset:0;z-index:94;background:#F3EEE4}</style>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;background:#F3EEE4;color:#1B2A2D;font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:var(--fg-accent);text-decoration:none}a:hover{color:var(--action-primary-hover)}</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="waitlist.js"></script>
<script src="_ds_bundle.js"></script>
<script src="science/ingredients.js"></script>
<script src="./image-slot.js"></script>
</helmet>
<x-import component="TRMSite" from="./site/Site.jsx" page="{{ page }}" on-route="{{ onRoute }}" hint-size="100%,100vh">
  <sc-if value="{{ isScience }}" hint-placeholder-val="{{ false }}"><dc-import name="Our Science" embedded="{{ true }}" on-navigate="{{ nav }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ isStory }}" hint-placeholder-val="{{ false }}"><dc-import name="Our Story v2" embedded="{{ true }}" hint-size="100%,100vh"></dc-import></sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { route: null };
  onRoute = (r) => { if (r !== this.state.route) this.setState({ route: r }); };
  nav = (r) => { window.TRMGo && window.TRMGo(r); };
  renderVals() {
    const p = this.props.page;
    return { page: p === 'Product' ? 'Products' : p === 'Home' ? 'Home' : undefined, onRoute: this.onRoute, nav: this.nav, isScience: this.state.route === 'Our Science', isStory: this.state.route === 'Our Story' };
  }
}
</script>
</body>
</html>
