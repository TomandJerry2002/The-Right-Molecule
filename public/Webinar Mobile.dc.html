<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script>/* Real phones get the responsive page full-screen */try{if((screen.width||9999)<=640||window.innerWidth<=640)location.replace('Webinar.dc.html'+location.search+location.hash)}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
<meta name="robots" content="noindex">
<title>InnerAtlas × Plyolife live workshop · Mobile preview</title>
<style>html,body{margin:0;background:#E9E2D4}*{box-sizing:border-box}a{color:var(--fg-accent)}a:hover{color:var(--action-primary-hover)}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--bg-sunken);font-family:var(--font-sans);">
  <div data-screen-label="Phone" style="position:relative;width:390px;height:min(844px,calc(100vh - 64px));border-radius:52px;border:10px solid #14181A;box-shadow:0 40px 80px rgba(6,48,63,.25);overflow:hidden;background:var(--bg-page);isolation:isolate;">
    <iframe ref="{{ frameRef }}" src="Webinar.dc.html?frame" title="InnerAtlas × Plyolife live workshop" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block;"></iframe>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  frameRef = React.createRef();
  componentDidMount() {
    const f = this.frameRef.current;
    if (f && location.hash) f.src = "Webinar.dc.html?frame" + location.hash;
  }
  renderVals() { return { frameRef: this.frameRef }; }
}
</script>
</body>
</html>
